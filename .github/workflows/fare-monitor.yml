name: Fare Monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # هر ۶ ساعت (UTC)
  workflow_dispatch: {}      # دکمه‌ی اجرای دستی تو تب Actions

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fare monitor
        run: python fare_monitor.py

      - name: Commit and push results
        run: |
          git config user.name "fare-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fares.db docs/data.json
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
